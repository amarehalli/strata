[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata"
version = "0.1.0"
description = "Align and transfer labels between spatial-transcriptomics datasets (Xenium x Visium and beyond)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "scanpy>=1.9",
    "POT>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-timeout",
]

[project.scripts]
strata = "strata.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["strata*"]

[tool.setuptools.package-data]
strata = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
timeout = 120
